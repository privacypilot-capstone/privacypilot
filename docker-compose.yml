services:
  backend:
    build: ./backend
    command: >
      sh -c "pip install -r requirements.txt --break-system-packages -q &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://pilot:pilot@db:5432/privacypilot
      - REDIS_URL=redis://redis:6379/0
      # Key for the GitHub token in task messages (backend/security.py). Optional:
      # unset, a random key is created in backend/.token_key and shared by both services.
      - PRIVACYPILOT_TOKEN_KEY=${PRIVACYPILOT_TOKEN_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot
      POSTGRES_DB: privacypilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d privacypilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    command: >
      sh -c "pip install -r requirements.txt --break-system-packages -q &&
             celery -A tasks worker --loglevel=info --concurrency=$${WORKER_CONCURRENCY:-$$(nproc)}"
    # --concurrency = worker processes = chunks scanned in parallel. Default:
    # one per CPU core (the scan is CPU-bound). The spaCy model is loaded once
    # in the parent and shared by all processes (tasks._preload_models), so
    # each process needs far less than its own ~1 GB copy. Override on a small
    # machine:  WORKER_CONCURRENCY=2 docker compose up
    # More machines / containers:  docker compose up --scale worker=3
    environment:
      - DATABASE_URL=postgresql://pilot:pilot@db:5432/privacypilot
      - REDIS_URL=redis://redis:6379/0
      # Key for the GitHub token in task messages (backend/security.py). Optional:
      # unset, a random key is created in backend/.token_key and shared by both services.
      - PRIVACYPILOT_TOKEN_KEY=${PRIVACYPILOT_TOKEN_KEY:-}
      - PYTHONPATH=/app
      # Repository snapshots: downloaded once per commit, read by every
      # chunk task. Must be shared by all worker processes (one volume).
      - PRIVACYPILOT_SNAPSHOT_DIR=/data/snapshots
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-}
      # Parallelism comes from the worker processes; one math-library thread
      # per process stops N processes × N BLAS/torch threads from fighting
      # over the same N cores.
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      # Detection settings (see README, "Checks"). VAGUENESS_SCOPE: statement (default) | notice
      - PRIVACYPILOT_VAGUENESS_SCOPE=${PRIVACYPILOT_VAGUENESS_SCOPE:-statement}
      - PRIVACYPILOT_INCLUDE_TEST_CODE=${PRIVACYPILOT_INCLUDE_TEST_CODE:-0}
      - PRIVACYPILOT_INCLUDE_EXAMPLE_CODE=${PRIVACYPILOT_INCLUDE_EXAMPLE_CODE:-0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - snapshots:/data/snapshots

volumes:
  snapshots:
